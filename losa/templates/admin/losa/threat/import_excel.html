{% extends "admin/base_site.html" %}

{% block content %}
  <p>
    Повторная загрузка обновляет угрозы по коду.
    Существующие связи с проверками сохраняются.
  </p>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="submit-row">
      <input type="submit" value="Загрузить" class="default">
      <a href="{{ changelist_url }}">Вернуться к списку</a>
    </div>
  </form>
{% endblock %}

{% extends "admin/base_site.html" %}

{% block content %}
  <p>
    Колонки файла: <strong>code, name, type_code</strong>.
    Типы ошибок должны быть заранее созданы в справочнике.
  </p>
  <p>
    Существующие ошибки обновляются по коду.
    Связи с проверками сохраняются.
  </p>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="submit-row">
      <input type="submit" value="Загрузить" class="default">
      <a href="{{ changelist_url }}">Вернуться к списку</a>
    </div>
  </form>
{% endblock %}

{% extends 'losa/base.html' %}


{% block title %}Контролирование ошибок{% endblock %}
{% block content %}
<div class="content">
<!-- шапка раздела -->
        <div class="flight-description">
            <h2>КОНТРОЛИРОВАНИЕ ОШИБОК</h2>
                <ul class="tooltip-list">
                    <li><span data-tooltip="Сознательное отступление от установленных правил и/или предусмотренных процедур">Преднамеренное нарушение</span></li>
                    <li><span data-tooltip="Отклонение от нормы при выполнении установленных правил и/или предусмотренных процедур.
                         Намерения правильные, но исполнение неточное. Сюда же относятся ошибки, связанные с несовершением какого-либо действия по забывчивости">Процедурная Ошибка</span></li>
                    <li><span data-tooltip="Неустановление связи, неверная интерпретация сообщения или неудача в попытке передать требуемую информацию другим членам экипажа и внешнему абоненту (например, диспетчеру УВД или персоналу наземного обслуживания)">Коммуникационная ошибка</span></li>
                    <li><span data-tooltip="Недостаточность знаний или координации движений при пилотировании (например: «штурвал - педали»)">Профессиональная ошибка</span></li>
                    <li><span data-tooltip="Ошибка в принятии решения при обстоятельствах, не оговоренных в правилах или в инструкциях, регламентирующих выполнение процедур, не обязательно ставившая под угрозу безопасность полета.
                          Для отнесения ошибки в данную категорию необходимо наличие хотя бы одного из трех условий, а именно:
                - экипаж был ограничен в выборе средств, необходимых для выхода из создавшейся ситуации, и поэтому решил не использовать их;
                - решение не было высказано и поэтому не разделялось всеми членами экипажа или
                - экипаж располагал временем, но не смог им эффективно воспользоваться для оценки правильности принятого решения">Ошибка в принятии решения</span></li>
                </ul>
        </div>


        <div id="mistake-container">

<!-- Сюда будут добавляться блоки -->

        </div>


<!--    </div>-->

    <button type="button" id="add-mistake" class="form-submit">+ Добавить ошибку</button>
    <button type="button" class="form-submit" onclick="saveStage(7)">Сохранить. Контролирование ошибок(7)</button>


</div>


{% endblock %}
